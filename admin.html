<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; manifest-src 'self'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Study Quest Admin</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070304">
<link rel="stylesheet" href="fonts.css">
<style>
/* Control room: near-black panels, red accent, thin red borders with corner brackets, status readouts. Dark only. */
:root{color-scheme:dark;--bg:#070304;--panel:#12090c;--panel2:#1a0d11;--tx:#f4eaeb;--mut:#b8a2a5;--red:#ff6b6b;--redbtn:#c81e2a;--line:#5c1c24;--line2:#8a2a33;--ok:#4ade80;--warn:#ffb020;--off:#a9a1a3;--focus:#ffd5d5;--glow:rgba(255,60,70,.16);
--fd:"Space Grotesk","Inter",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--tx);font:16px/1.5 var(--fb);background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(200,30,42,.22),transparent 70%),var(--bg);background-repeat:no-repeat;touch-action:manipulation;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* faint grid + one slow sweep band, both fixed and transform-only (cheap) */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,80,90,.045) 0 1px,transparent 1px 4px),linear-gradient(90deg,rgba(255,80,90,.04) 1px,transparent 1px) 0 0/48px 100%}
body::after{content:"";position:fixed;left:0;right:0;top:-30vh;height:30vh;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,70,80,.09),transparent);animation:sweep 11s linear infinite;will-change:transform}
@keyframes sweep{to{transform:translateY(160vh)}}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
.mut{color:var(--mut)}.small{font-size:13px}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.kick{display:block;font:700 11px var(--fd);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
/* top bar */
#bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#bar[hidden]{display:none}
#bar h1{font-size:19px;letter-spacing:.1em;display:flex;align-items:center;gap:10px;min-width:0}
#bar h1 span{color:var(--red)}#bar h1 b{font-weight:500;color:var(--mut);letter-spacing:.04em}
.led{flex:none;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,107,107,.6),0 0 10px var(--red);animation:led 2s ease-out infinite}
@keyframes led{0%{box-shadow:0 0 0 0 rgba(255,107,107,.6),0 0 10px var(--red)}70%,100%{box-shadow:0 0 0 9px rgba(255,107,107,0),0 0 10px var(--red)}}
#bar nav{display:flex;align-items:center;gap:14px;font-size:14px}
#bar nav a{display:inline-flex;align-items:center;min-height:40px}
#bar .lnk{margin:0;min-height:40px;padding:6px 14px;border:1px solid var(--line2);border-radius:6px;text-decoration:none;color:var(--tx);font-weight:600}
/* counters */
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
#stats[hidden]{display:none}
.st{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.st span{display:block;font:700 11px var(--fd);letter-spacing:.16em;color:var(--mut)}
.st b{display:block;font:700 28px/1.15 var(--fd);font-variant-numeric:tabular-nums;color:var(--tx)}
.st.hot b{color:var(--warn)}.st.act b{color:var(--ok)}.st.den b{color:var(--red)}
/* panels */
.card,.authcard{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:3px;padding:18px 16px;margin:0 0 14px;min-width:0;box-shadow:0 0 28px var(--glow),inset 0 0 40px rgba(0,0,0,.35);
background-image:linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(var(--red),var(--red)),linear-gradient(180deg,var(--panel2),var(--panel));
background-repeat:no-repeat;background-size:14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,100% 100%;
background-position:left top,left top,right top,right top,left bottom,left bottom,right bottom,right bottom,0 0}
h2{font-size:20px;margin-bottom:6px;letter-spacing:.02em}
h3.gh{font-size:15px;margin:14px 0 2px;color:var(--red);letter-spacing:.04em}
/* rows */
.req{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
h2+.req,h3+.req{border-top:0}
.req.focus{background:rgba(255,107,107,.1);outline:1px solid var(--red);border-top-color:transparent;padding:12px}
.who{min-width:0;overflow-wrap:anywhere}.acts{display:flex;gap:8px;flex-wrap:wrap}
.cs{font-family:var(--fd);letter-spacing:.14em}
.who .small{font-variant-numeric:tabular-nums}
/* status tags */
.tag{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--fd);letter-spacing:.06em;border:1px solid var(--off);color:var(--off);border-radius:3px;padding:1px 8px;margin:0 6px 4px 0;vertical-align:middle}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.ok::before{box-shadow:0 0 6px var(--ok)}
.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.warn::before{animation:blink 1.1s steps(2,jump-none) infinite}
.tag.bad{color:var(--red);border-color:var(--red)}
@keyframes blink{50%{opacity:.15}}
/* buttons */
.btn{min-height:46px;padding:10px 20px;border-radius:4px;font:700 15px var(--fd);letter-spacing:.04em;color:#fff;background:var(--redbtn);border:1px solid #ff8f8f;box-shadow:0 0 16px rgba(255,60,70,.25);transition:background .2s,box-shadow .2s,transform .15s}
.btn.s{min-height:40px;padding:6px 14px;font-size:14px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
@media(hover:hover){.btn:hover:not(:disabled){background:#e0303d;box-shadow:0 0 22px rgba(255,60,70,.45)}.btn.g:hover:not(:disabled){background:rgba(255,107,107,.12);border-color:var(--red)}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--panel);color:var(--tx);border:1px solid var(--red);border-radius:3px;padding:10px 16px;max-width:calc(100vw - 32px);font:600 14px var(--fd);letter-spacing:.03em;box-shadow:0 0 24px rgba(255,60,70,.3);animation:toast .3s ease-out}
#toast::before{content:"> ";color:var(--red)}
#toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
/* sign-in card rendered by web.js */
#auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(200,30,42,.25),transparent 70%),var(--bg);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#auth[hidden]{display:none}
.authcard{width:100%;max-width:400px;padding:26px 22px;text-align:center;margin:0}
.authcard h2{margin:6px 0 6px;font-size:22px}.authcard p{margin:0 0 14px}
.alogo{color:var(--red);display:grid;place-items:center}.alogo .sweep{transform-origin:32px 34px;animation:spin 3.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lab{display:block;text-align:left;font:700 11px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:6px 0 4px}
.ain{width:100%;min-height:50px;border-radius:4px;border:1px solid var(--line2);background:#0a0405;padding:10px 14px;font-size:17px;color:var(--tx)}
.ain:focus{border-color:var(--red);outline:3px solid var(--focus);outline-offset:1px}
.ain.code{text-align:center;font:700 26px var(--fd);letter-spacing:.3em}
.authcard .btn{width:100%;margin-top:6px}
.lnk{margin-top:12px;color:var(--red);font-weight:700;text-decoration:underline;min-height:44px}
.err{color:var(--red);min-height:22px;font-size:14px;font-weight:600;margin:6px 0}
.spin{width:34px;height:34px;margin:8px auto 14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:spin 1s linear infinite}
.consent{margin:12px 0 0!important}.consent a{color:var(--red)}
@media(max-width:420px){#bar h1{font-size:16px}.card{padding:16px 12px}.acts .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){body::after{display:none}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.led{animation:none}.tag.warn::before{animation:none}}
</style></head><body>
<div class="wrap"><div id="bar" hidden><h1><i class="led" aria-hidden="true"></i><span>CONTROL ROOM</span> <b>· Study Quest</b></h1><nav aria-label="Admin"><a href="./">Study guide</a><button type="button" id="signout" class="lnk">Sign out</button></nav></div><section id="stats" aria-label="Totals" hidden></section><main id="admin"></main></div>
<div id="auth"></div><div id="toast" role="status" hidden></div>
<script src="config.js"></script><script src="web.js?v=11"></script><script src="admin.js?v=10"></script>
</body></html>
