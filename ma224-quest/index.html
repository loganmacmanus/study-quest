/* look: chalk. Math class: a green chalkboard (dark, the default) and clean graph paper (light).
   Dark = deep slate green with chalk-white text, chalk yellow and soft blue accents. Light = off-white paper with ink-blue accent and red-pen secondary.
   The page is dark unless the player picked light (data-theme="light"). Per-guide overrides only; layout comes from the shared page CSS above.
   Logo, background animation (drifting chalk symbols and a faint grid) and the colour-theme options come from shared/looks.js (GUIDE.look = "chalk"). */
:root{--bg:#f6f8fc;--bg2:#e8eef8;--card:#fff;--cardA:rgba(255,255,255,.9);--tx:#1b2340;--mut:#475676;--ac:#1d4ed8;--bt:#fff;--ac2:#b3261e;--ok:#166534;--bad:#b91c1c;--warn:#92400e;--bd:#c6d3ea;--glow:rgba(29,78,216,.22);--net:29,78,216;
--fd:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif}
:root:not([data-theme="light"]){--bg:#14261f;--bg2:#1b3329;--card:#203b30;--cardA:rgba(32,59,48,.9);--tx:#f3f1e4;--mut:#bccdc2;--ac:#f2d675;--ac2:#9fd0f5;--bt:#14261f;--ok:#6ee7a0;--bad:#ffa3a3;--warn:#fbbf24;--bd:#3b5d4c;--glow:rgba(242,214,117,.26);--net:236,240,226;color-scheme:dark}
.ov{background:rgba(8,18,14,.76)}
:root:not([data-theme="light"]) .card{border-style:solid;border-color:var(--bd);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.04)}
:root:not([data-theme="light"]) #hud{border-bottom:3px solid #8a6a43}
:root[data-theme="light"] #hud{border-bottom:2px solid var(--ac2)}
.chalk-wob{animation:chalkwob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes chalkwob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){.chalk-wob{animation:none}}
</style>
